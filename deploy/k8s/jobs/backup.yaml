apiVersion: batch/v1
kind: Job
metadata:
  name: pre-migration-backup
  namespace: jabasurvivol
  labels:
    app.kubernetes.io/name: pre-migration-backup
    app.kubernetes.io/part-of: jabasurvivol
spec:
  backoffLimit: 1
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pre-migration-backup
        app.kubernetes.io/part-of: jabasurvivol
    spec:
      restartPolicy: Never
      serviceAccountName: jabasurvivol
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: backup
          image: postgres:17-alpine
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              file="/backups/pre-migration-${BACKUP_VERSION}.dump"
              pg_dump -h postgres -U postgres -d jabasurvivol -Fc -f "$file"
              test -s "$file"
          env:
            - name: BACKUP_VERSION
              value: __VERSION__
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: jabasurvivol-secrets
                  key: postgres-password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 300m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: backups
              mountPath: /backups
      volumes:
        - name: backups
          persistentVolumeClaim:
            claimName: postgres-backup
