apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: bff
  namespace: jabasurvivol
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - api.jabasurvivol.example.com
      secretName: jabasurvivol-tls
  rules:
    - host: api.jabasurvivol.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: bff
                port:
                  number: 8080
