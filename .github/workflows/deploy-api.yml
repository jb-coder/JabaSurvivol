name: deploy-api

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to deploy
        required: true
        default: 0.5.0
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    env:
      VERSION: ${{ github.event.inputs.version || github.ref_name }}
      REGISTRY_PREFIX: ghcr.io/${{ github.repository_owner }}/jabasurvivol
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Normalize version
        run: echo "VERSION=${VERSION#v}" >> "$GITHUB_ENV"

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore and test
        run: |
          dotnet restore JabaSurvivol.slnx
          dotnet test JabaSurvivol.slnx -c Release --no-restore

      - name: Configure kubeconfig
        env:
          KUBE_CONFIG_B64: ${{ secrets.KUBE_CONFIG_B64 }}
        run: |
          echo "$KUBE_CONFIG_B64" | base64 -d > "$RUNNER_TEMP/kubeconfig"
          echo "KUBECONFIG=$RUNNER_TEMP/kubeconfig" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Identity API
        id: identity
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Services/Identity.Api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_PREFIX }}/identity-api:${{ github.sha }}
            ${{ env.REGISTRY_PREFIX }}/identity-api:${{ env.VERSION }}

      - name: Build and push Game API
        id: game
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Services/Game.Api/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_PREFIX }}/game-api:${{ github.sha }}
            ${{ env.REGISTRY_PREFIX }}/game-api:${{ env.VERSION }}

      - name: Build and push Telemetry Worker
        id: worker
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Services/Telemetry.Worker/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_PREFIX }}/telemetry-worker:${{ github.sha }}
            ${{ env.REGISTRY_PREFIX }}/telemetry-worker:${{ env.VERSION }}

      - name: Build and push BFF
        id: bff
        uses: docker/build-push-action@v7
        with:
          context: .
          file: src/Gateway/Bff/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY_PREFIX }}/bff:${{ github.sha }}
            ${{ env.REGISTRY_PREFIX }}/bff:${{ env.VERSION }}

      - name: Apply support manifests
        run: |
          kubectl apply -f deploy/k8s/base/namespace.yaml
          kubectl apply -f deploy/k8s/base/serviceaccount.yaml
          kubectl apply -f deploy/k8s/base/configmap.yaml
          kubectl apply -f deploy/k8s/base/postgres.yaml
          kubectl apply -f deploy/k8s/base/network-policies.yaml
          kubectl -n jabasurvivol rollout status statefulset/postgres --timeout=180s

      - name: Pre-migration backup
        run: |
          kubectl -n jabasurvivol exec postgres-0 -- \
            pg_dump -U postgres -d jabasurvivol -Fc > "backup-${VERSION}.dump"
          test -s "backup-${VERSION}.dump"

      - name: Upload pre-migration backup
        uses: actions/upload-artifact@v7
        with:
          name: pre-migration-backup-${{ env.VERSION }}
          path: backup-${{ env.VERSION }}.dump
          retention-days: 7
          if-no-files-found: error

      - name: Run database migrations
        run: |
          kubectl -n jabasurvivol delete job db-migrate --ignore-not-found
          sed -i "s/:0.5.0/:${VERSION}/g" deploy/k8s/jobs/migration.yaml
          kubectl apply -f deploy/k8s/jobs/migration.yaml
          if ! kubectl -n jabasurvivol wait --for=condition=complete job/db-migrate --timeout=300s; then
            kubectl -n jabasurvivol logs job/db-migrate --all-containers=true || true
            exit 1
          fi

      - name: Apply application manifests
        run: kubectl apply -k deploy/k8s/overlays/prod

      - name: Roll out image digests
        run: |
          kubectl -n jabasurvivol set image deployment/identity-api \
            "identity-api=${REGISTRY_PREFIX}/identity-api@${{ steps.identity.outputs.digest }}"
          kubectl -n jabasurvivol set image deployment/game-api \
            "game-api=${REGISTRY_PREFIX}/game-api@${{ steps.game.outputs.digest }}"
          kubectl -n jabasurvivol set image deployment/telemetry-worker \
            "telemetry-worker=${REGISTRY_PREFIX}/telemetry-worker@${{ steps.worker.outputs.digest }}"
          kubectl -n jabasurvivol set image deployment/bff \
            "bff=${REGISTRY_PREFIX}/bff@${{ steps.bff.outputs.digest }}"

      - name: Wait for rollout
        run: |
          kubectl -n jabasurvivol rollout status deployment/identity-api --timeout=180s
          kubectl -n jabasurvivol rollout status deployment/game-api --timeout=180s
          kubectl -n jabasurvivol rollout status deployment/telemetry-worker --timeout=180s
          kubectl -n jabasurvivol rollout status deployment/bff --timeout=180s

      - name: Smoke test through the BFF
        run: |
          kubectl -n jabasurvivol port-forward svc/bff 18080:8080 > /tmp/port-forward.log 2>&1 &
          PORT_FORWARD_PID=$!
          trap 'kill $PORT_FORWARD_PID || true' EXIT
          sleep 5
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:18080/api/v1/status
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:18080/health
          curl -fsS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:18080/alive

      - name: Roll back on failure
        if: failure()
        run: bash deploy/scripts/rollback.sh
