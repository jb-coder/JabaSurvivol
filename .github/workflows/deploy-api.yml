name: deploy-api

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    if: ${{ vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore and test
        run: |
          dotnet restore JabaSurvivol.slnx
          dotnet test JabaSurvivol.slnx -c Release --no-restore

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Game API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Services/Game.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/game-api:${{ github.sha }}

      - name: Build and push Identity API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Services/Identity.Api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/identity-api:${{ github.sha }}

      - name: Build and push Telemetry Worker
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Services/Telemetry.Worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/telemetry-worker:${{ github.sha }}

      - name: Build and push BFF
        uses: docker/build-push-action@v6
        with:
          context: .
          file: src/Gateway/Bff/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/bff:${{ github.sha }}
